<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melofinds</title>
<style>
  :root { color-scheme: dark; --acc: #8b5cf6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0b10; color: #e8e6f0; font: 16px/1.5 system-ui, -apple-system, Roboto, sans-serif; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  .head { text-align: center; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  p { margin: 0; color: #a0a6b6; }
  button { font: 600 15px system-ui, sans-serif; color: #fff; border: 0; cursor: pointer; }
  .retry { justify-self: center; border-radius: 999px; padding: 11px 22px; background: linear-gradient(90deg, #8b5cf6, #ec4899); }
  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #8b879b; margin: 10px 0 0; }
  .row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid #262a36; background: #14161d; text-align: left; }
  .row.on { border-color: #6d4fd8; background: #1b1730; }
  .row .play { width: 38px; height: 38px; border-radius: 50%; background: var(--acc); font-size: 15px; }
  .row b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; border: 1px solid #4b3a8f; background: #17142a; }
  .player b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl { display: flex; justify-content: center; gap: 14px; }
  .ctl button { width: 44px; height: 44px; border-radius: 50%; background: #262a36; font-size: 16px; }
  .ctl .main { width: 52px; height: 52px; background: var(--acc); }
  .seek { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font: 12px ui-monospace, monospace; color: #a0a6b6; }
  input[type="range"] { width: 100%; accent-color: var(--acc); }
  .muted { color: #8b879b; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>Pas de connexion</h1>
    <p>Melofinds a besoin d’Internet pour chercher les prods.</p>
  </div>
  <button type="button" class="retry" onclick="location.href='https://kimany91.github.io/Melofinds/'">Réessayer</button>

  <!-- Prods du dossier « Melofinds Instru » : écoute hors connexion (même écran verrouillé) -->
  <section id="offline" hidden>
    <h2>Tes prods sur le téléphone</h2>
    <div id="player" class="player" hidden>
      <b id="pTitle"></b>
      <div class="seek"><span id="pPos">0:00</span><input id="pSeek" type="range" min="0" max="1000" value="0" aria-label="Position"><span id="pDur">0:00</span></div>
      <div class="ctl">
        <button type="button" data-cmd="prev" aria-label="Précédente">⏮</button>
        <button type="button" data-cmd="toggle" class="main" id="pToggle" aria-label="Lecture / pause">▶</button>
        <button type="button" data-cmd="next" aria-label="Suivante">⏭</button>
        <button type="button" data-cmd="stop" aria-label="Arrêter">■</button>
      </div>
    </div>
    <div id="list" style="display:grid;gap:8px;margin-top:10px"></div>
  </section>
</main>
<script>
(function () {
  var cap = window.Capacitor;
  var n = cap && cap.Plugins && cap.Plugins.MelofindsNative;
  if (!n || !n.phoneList) return;
  var files = [];
  var state = null;
  var seeking = false;
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (ms) { var s = Math.max(0, Math.round((ms || 0) / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };
  function render() {
    var list = $('list');
    list.textContent = '';
    files.forEach(function (f, i) {
      var row = document.createElement('div');
      row.className = 'row' + (state && state.name === f.name ? ' on' : '');
      var b = document.createElement('button');
      b.className = 'play';
      b.type = 'button';
      b.textContent = '▶';
      b.setAttribute('aria-label', 'Écouter');
      b.onclick = function () { n.phonePlay({ names: files.map(function (x) { return x.name; }), index: i }).catch(function () {}); };
      var t = document.createElement('span');
      var name = document.createElement('b');
      name.textContent = String(f.name).replace(/\.[a-z0-9]+$/i, '');
      t.appendChild(name);
      row.appendChild(b);
      row.appendChild(t);
      list.appendChild(row);
    });
    if (!files.length) list.innerHTML = '<p class="muted">Aucune prod sur le téléphone pour l’instant.</p>';
  }
  function renderPlayer() {
    var on = state && state.active && state.name;
    $('player').hidden = !on;
    if (!on) return;
    $('pTitle').textContent = state.title || state.name;
    $('pPos').textContent = fmt(state.position);
    $('pDur').textContent = fmt(state.duration);
    if (!seeking) $('pSeek').value = state.duration ? Math.round(state.position / state.duration * 1000) : 0;
    $('pToggle').textContent = state.playing ? '❚❚' : '▶';
    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (r, i) { r.classList.toggle('on', files[i] && files[i].name === state.name); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'), function (b) {
    b.onclick = function () { n.phoneControl({ cmd: b.dataset.cmd }).catch(function () {}); };
  });
  $('pSeek').oninput = function () { seeking = true; };
  $('pSeek').onchange = function () { seeking = false; n.phoneControl({ cmd: 'seek', ms: Math.round($('pSeek').value / 1000 * ((state && state.duration) || 0)) }).catch(function () {}); };
  if (n.addListener) n.addListener('phonePlayer', function (st) { state = st; renderPlayer(); });
  n.phoneList().then(function (r) {
    files = (r && r.files || []).slice().sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
    $('offline').hidden = false;
    render();
    return n.phoneState ? n.phoneState() : null;
  }).then(function (st) { if (st) { state = st; renderPlayer(); } }).catch(function () { /* dossier pas encore choisi */ });
})();
</script>
</body>
</html>
