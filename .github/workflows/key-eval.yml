# Banc d'essai de la détection de clé sur de vrais morceaux annotés (GiantSteps+ Key,
# CC BY-SA 4.0, téléchargé à chaque fois : rien n'est gardé dans le dépôt).
name: Banc d'essai clé (vrais morceaux)

on:
  push:
    paths:
      - 'scripts/key-eval*.mjs'
      - 'src/core/audiokey.js'
      - '.github/workflows/key-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Outils
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          npm install --no-save essentia.js@0.1.3
      - name: Morceaux annotés (GiantSteps+ Key, Zenodo)
        run: |
          mkdir -p "$RUNNER_TEMP/gs" && cd "$RUNNER_TEMP/gs"
          curl -fsSL --retry 3 -o keys.zip "https://zenodo.org/record/1095691/files/keys.zip?download=1"
          curl -fsSL --retry 3 -o audio.zip "https://zenodo.org/record/1095691/files/audio.zip?download=1"
          unzip -q keys.zip -d keys && unzip -q audio.zip -d audio
          find keys -type f | head -3; find audio -type f -name '*.mp3' | wc -l
      - name: Analyse (4 en parallèle)
        run: |
          for p in 0 1 2 3; do node scripts/key-eval.mjs "$RUNNER_TEMP/gs/audio" "$RUNNER_TEMP/gs/keys" $p 4 > "$RUNNER_TEMP/r$p.txt" 2>"$RUNNER_TEMP/e$p.txt" & done; wait
          cat "$RUNNER_TEMP"/r*.txt > "$RUNNER_TEMP/all.txt"
          tail -3 "$RUNNER_TEMP"/e*.txt || true
          grep -h "^exemple" "$RUNNER_TEMP/all.txt" || true
      - name: Résultats
        run: |
          node scripts/key-eval-summary.mjs "$RUNNER_TEMP/all.txt"
          grep -h "^R " "$RUNNER_TEMP/all.txt"
