# Vérifie l'app web à chaque changement : tests du moteur, puis les services de BPM / clé
# appelés comme le ferait le navigateur depuis le site de l'app (en-tête Origin de GitHub
# Pages) : on voit s'ils répondent et s'ils autorisent le site (en-têtes CORS).
name: App web (tests)

on:
  push:
    paths:
      - 'artifact/**'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur
        if: matrix.os == 'ubuntu-latest'
        run: npm test
      - name: BPM / clé depuis le navigateur (CORS)
        run: |
          ORIGIN="https://kimany91.github.io"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          probe() {  # $1 = nom, $2 = adresse
            echo "=== $1"
            curl -sS -m 25 -D h.txt -o b.json -H "Origin: $ORIGIN" -H "Accept: application/json" -H "User-Agent: $UA" "$2" || true
            head -1 h.txt || true
            grep -i "access-control-allow-origin\|cf-mitigated\|content-type" h.txt || echo "(pas d'en-tête CORS)"
            head -c 400 b.json; echo
          }
          probe "Tunebat (recherche)" "https://api.tunebat.com/api/tracks/search?term=nemzzz"
          probe "ReccoBeats (recherche)" "https://api.reccobeats.com/v1/track/search?searchText=nemzzz&size=3"
          ID=$(node -e 'try{const j=require("./b.json");const c=j.content||j.items||j.data||[];console.log((c[0]||{}).id||"")}catch{}')
          echo "id ReccoBeats : $ID"
          if [ -n "$ID" ]; then probe "ReccoBeats (BPM / clé)" "https://api.reccobeats.com/v1/track/$ID/audio-features"; fi
