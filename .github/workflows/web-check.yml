# Vérifie l'app web à chaque changement : tests du moteur (licences, recherche, analyse
# du BPM et de la clé à partir du son).
name: App web (tests)

on:
  push:
    paths:
      - 'artifact/**'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur (licences, recherche, analyse BPM / clé du son)
        run: npm test
