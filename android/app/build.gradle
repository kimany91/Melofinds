apply plugin: 'com.android.application'

android {
    namespace = "io.github.kimany91.melofinds"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.kimany91.melofinds"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // numéro de version donné par la construction GitHub (APK_VERSION_CODE / APK_VERSION)
        versionCode((System.getenv("APK_VERSION_CODE") ?: "1") as Integer)
        versionName(System.getenv("APK_VERSION") ?: "1.0.0")
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // NewPipe Extractor utilise des outils Java récents : rendus compatibles avec les vieux Android
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests.all {
            testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/README.md', 'META-INF/CHANGES', 'META-INF/COPYRIGHT']
        }
    }
    // Signature : clé privée gardée HORS du dépôt (secret GitHub, ou clé de la construction)
    signingConfigs {
        release {
            def ks = System.getenv("APK_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("APK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("APK_KEY_ALIAS") ?: "melofinds"
                keyPassword System.getenv("APK_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("APK_KEYSTORE")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // Son YouTube direct (même version que l'appli NewPipe)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:e8f89145a830b4d6cae32412007f24ea8b36c73a'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    // Scanner de QR code de Google (sans accès à l'appareil photo pour Melofinds)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
